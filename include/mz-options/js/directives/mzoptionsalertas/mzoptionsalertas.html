<div class="header-section-configurador">
    <h2>{{'views.label.alertas' | translate}}</h2>    
    <span class="pin-active-visibility" ng-attr-title="{{message}}" ng-click="anclarThis($event)" ng-class="isVisibleLinkAlertas == true ? 'active' : ''">
        <i class="icofont icofont-tack-pin"></i>
        <i class="icofont icofont-minus-circle pin-desanclar"></i>
    </span>
</div>
<div class="content-section-configurador">
    <div class="notificationsScroll">
        <div class="aviso-empty" ng-if="!arrAlertas || arrAlertas.length < 1">
            {{"views.label.noAlerts" | translate}}
        </div>
        <div class="item-notifications" ng-repeat="item in arrAlertas | orderBy:'id'  track by item.id">
            <div class="item-notifications-inner">
                <div class="noti-input">
                    <label class="lui-checkbox">
                        <input class="lui-checkbox__input" type="checkbox" aria-label="Label" ng-click="hideOptions($event, item.model)" />
                        <div class="lui-checkbox__check-wrap">
                            <span class="lui-checkbox__check"></span>
                        </div>
                    </label>

                                    </div>
                <div class="noti-text">
                    <h3>{{item.name}}</h3>
                    <p>{{item.message}}</p>
                    <div class="noti-tag">
                        <div class="tag-color" data-type="{{item.type}}"></div>
                        <div class="tag-label">{{item.type}}</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
