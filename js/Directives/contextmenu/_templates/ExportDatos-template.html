<div class="lui-dialog lui-dialog-mz" style="width: 600px;"> 
    <div class="lui-dialog__header">
        <div class="lui-dialog__title" q-translation="Export.Completed"></div>
    </div>
    <div class="export-dialog-body lui-dialog__body">
        <p class="pb-10 ng-scope">
            <span q-translation="Export.CompletedDescription"></span>
            
        </p>
        <p class="pb-10 ng-scope">
            <a class="export-url" ng-href="{{URLDOWNLOAD}}" target="_blank" q-translation="Export.CompletedLink" ></a>
        </p>
    </div>

    <div class="lui-dialog__footer">
        <button class='lui-button  lui-dialog__button close-button' ng-click='closeDialog()'>{{'alerting.label.cancel' | translate}}</button>        
    </div>
</div>
