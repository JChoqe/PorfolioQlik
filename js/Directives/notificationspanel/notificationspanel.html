<div class="item-action" ng-click="bubble > 0 && toggleNotifications($event)">
    <span class="badge badge-pill badge-danger">{{arrAlertas.length }}</span>
    <i class="ri-notification-3-line qs-no-margin"></i>
</div>
<div id="notificationsPanel">
    <div id="contentNotifications">
        <div id="headerNotifications">
            <i class="ri-notification-3-line qs-no-margin"></i>
            <h3 class="ml-12">{{'views.notificaciones' | translate}}</h3>            
            <i class="icofont icofont-close-circled closeNotificationsIcon toRight" ng-click="toggleNotifications($event)"></i>
        </div>
        <div id="notificationsScroll">
            <div class="item-notifications" ng-repeat="item in arrAlertas | orderBy:'id'  track by item.id">
                <div class="item-notifications-inner">
                    <div class="noti-input">
                        <label class="lui-checkbox" title="{{'alerting.label.leeralerta' | translate}}">
                            <input class="lui-checkbox__input" type="checkbox" aria-label="Label" ng-click="hideOptions($event, item.model)" />
                            <div class="lui-checkbox__check-wrap">
                                <span class="lui-checkbox__check"></span>
                            </div>
                        </label>
                        
                    </div>
                    <div class="noti-text">
                        <h3>{{item.name}}</h3>
                        <p>{{item.message}}</p>
                        <div class="noti-tag">
                            <div class="tag-color" data-type="{{item.type}}"></div>
                            <div class="tag-label">{{item.type}}</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div id="notificationsOver" ng-click="toggleNotifications($event)"></div>
</div>
