<div class="panel" id="template_barchart" ng-controller="barChartProperties">
    <div id="collapsePresentacion">
        <div class="em-section-content">
            <div class="em-grouped">
                <div class="col-lg-12 border-bottom">
                    <div class="em-switch-component">
                        <div class="label ">
                            <div class="title">{{'equalizer.label.etiquetavalores'  | translate}}</div>
                            <div class="value">{{etiquetaValoresLabel}}</div>
                        </div>
                        <div class="lui-switch">
                            <label class="lui-switch__label" for="showEtiquetaValores">
                                <input type="checkbox" ng-model="showEtiquetaValores" class="lui-switch__checkbox" aria-label="Label" id="showEtiquetaValores" ng-change="changeEtiquetaValores($event, showEtiquetaValores)" ng-checked="showEtiquetaValores" />
                                <span class="lui-switch__wrap">
                                    <span class="lui-switch__inner"></span>
                                    <span class="lui-switch__switch"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="col-lg-12 d-flex flex-column justify-content-center align-content-center align-items-center p-3">
                    <div class="col-12 em-item em-item-inner em-selection-list-component" ng-if="ARRDIMENSIONS.length > 1 || ARRMEASURES.length > 1">
                        <ul class="col-12 em-item-selection-list em-item-list-2">
                            <li ng-class="{'em-active' : tipoFormato == 'grouped'}" aria-hidden="false">
                                <button ng-class="{'selected' : tipoFormato == 'grouped'}" title="{{'equalizer.label.agrupado'  | translate}}" class="item" ng-click="changeFormato('grouped')">
                                    <div class="em-component em-icon-item-component">
                                        grouped
                                    </div>
                                </button>
                                <div class="label" aria-hidden="false">
                                    <span>{{'equalizer.label.agrupado'  | translate}}</span>
                                </div>
                            </li>
                            <li ng-class="{'em-active' : tipoFormato == 'stacked'}" aria-hidden="false">
                                <button ng-class="{'selected' : tipoFormato == 'stacked'}" title="{{'equalizer.label.apilado'  | translate}}" class="item" ng-click="changeFormato('stacked')">
                                    <div class="em-component em-icon-item-component">
                                        stacked
                                    </div>
                                </button>
                                <div class="label" aria-hidden="false">
                                    <span>{{'equalizer.label.apilado'  | translate}}</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div class="col-12 em-item em-item-inner em-selection-list-component">
                        <ul class="col-12 em-item-selection-list em-item-list-2">
                            <li ng-class="{'em-active' : orientacion == 'vertical'}" aria-hidden="false">
                                <button ng-class="{'selected' : orientacion == 'vertical'}" title="<span>{{'equalizer.label.vertical'  | translate}}</span>" class="item" ng-click="changeOrientacion('vertical')">
                                    <div class="em-component em-icon-item-component">
                                        bars_vertical
                                    </div>
                                </button>
                                <div class="label" aria-hidden="false">
                                    <span><span>{{'equalizer.label.vertical'  | translate}}</span></span>
                                </div>
                            </li>
                            <li ng-class="{'em-active' : orientacion == 'horizontal'}" aria-hidden="false">
                                <button ng-class="{'selected' : orientacion == 'horizontal'}" title="<span>{{'equalizer.label.horizontal'  | translate}}</span>" class="item" ng-click="changeOrientacion('horizontal')">
                                    <div class="em-component em-icon-item-component">
                                        bars_horizontal
                                    </div>
                                </button>
                                <div class="label" aria-hidden="false">
                                    <span><span>{{'equalizer.label.horizontal'  | translate}}</span></span>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
