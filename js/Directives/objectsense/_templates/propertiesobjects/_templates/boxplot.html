<div class="panel" id="template_boxplot" ng-controller="boxplotProperties">
    <div id="collapsePresentacion">
        <div class="em-section-content">
            <div class="em-grouped">
                <div class="em-item em-item-inner em-selection-list-component">                                
                    <ul class="em-item-selection-list em-item-list-2">
                        <li ng-class="{'em-active' : orientacion == 'vertical'}" aria-hidden="false">
                            <button ng-class="{'selected' : orientacion == 'vertical'}" title="{{ 'equalizer.title.vertical' | translate}}" class="item" ng-click="changeOrientacion('vertical')">
                                <div class="em-component em-icon-item-component lui-icon">
                                    direction_up_down
                                </div>
                            </button>
                            <div class="label" aria-hidden="false">
                                <span>{{'equalizer.label.vertical' | translate}}</span>
                            </div>
                        </li>
                        <li ng-class="{'em-active' : orientacion == 'horizontal'}" aria-hidden="false">
                            <button ng-class="{'selected' : orientacion == 'horizontal'}" title="{{ 'equalizer.title.horizontal' | translate}}" class="item" ng-click="changeOrientacion('horizontal')">
                                <div class="em-component em-icon-item-component lui-icon">
                                    direction_left_right
                                </div>
                            </button>
                            <div class="label" aria-hidden="false">
                                <span>{{'equalizer.label.horizontal' | translate}}</span>
                            </div>
                        </li>
                    </ul>
                </div>
                
                <div class="em-item em-item-inner em-checkbox-component">
                    <div class="value">
                        <label class="lui-checkbox lui-checkbox--inverse">
                            <input class="lui-checkbox__input" type="checkbox"id="valoresExtremos" ng-model="valoresExtremos" ng-change="changeValoresExtremos()">
                            <div class="lui-checkbox__check-wrap">
                                <span class="lui-checkbox__check"></span>
                                <span class="lui-checkbox__check-text label">{{'equalizer.label.valoresextremos' | translate}}</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
