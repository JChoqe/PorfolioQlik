<div class="panel" id="template_combochart" ng-controller="comboChartProperties">
    <div id="collapsePresentacion">
        <div class="em-section-content">
            <div class="em-grouped">
                
                <div class="em-item em-item-inner em-selection-list-component">
                    <ul class="em-item-selection-list em-item-list-2">
                        <li ng-class="{'em-active' : orientacion == 'vertical'}" aria-hidden="false">
                            <button ng-class="{'selected' : orientacion == 'vertical'}"
                                title="<span>{{'equalizer.label.vertical'  | translate}}</span>" class="item"
                                ng-click="changeOrientacion('vertical')">
                                <div class="em-component em-icon-item-component">
                                    bars_vertical
                                </div>
                            </button>
                            <div class="label" aria-hidden="false">
                                <span><span>{{'equalizer.label.vertical' | translate}}</span></span>
                            </div>
                        </li>
                        <li ng-class="{'em-active' : orientacion == 'horizontal'}" aria-hidden="false">
                            <button ng-class="{'selected' : orientacion == 'horizontal'}"
                                title="<span>{{'equalizer.label.horizontal'  | translate}}</span>" class="item"
                                ng-click="changeOrientacion('horizontal')">
                                <div class="em-component em-icon-item-component">
                                    bars_horizontal
                                </div>
                            </button>
                            <div class="label" aria-hidden="false">
                                <span><span>{{'equalizer.label.horizontal' | translate}}</span></span>
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="col-lg-12 border-bottom" ng-if="isVisibleTipoValores">

                    <div class="em-item em-item-inner">{{'equalizer.label.valoresperdidos' | translate}}</div>
                    <div class="em-item em-item-inner em-radiobuttons-component">
                        <label class="lui-radiobutton  lui-radiobutton--inverse"
                            title="{{'equalizer.label.mostrarhuecos'  | translate}}">
                            <input class="lui-radiobutton__input" type="radio" ng-model="$parent.typeValoresPerdidos"
                                ng-change="cambiarTipoValores('gap')" name="valoresPerdidos" value="gap"
                                aria-invalid="false">
                            <div class="lui-radiobutton__radio-wrap" qva-tabindex="0">
                                <span class="lui-radiobutton__radio"></span>
                                <span class="lui-radiobutton__radio-text">{{'equalizer.label.mostrarhuecos' |
                                    translate}}</span>
                            </div>
                        </label>
                    </div>
                    <div class="em-item em-item-inner em-radiobuttons-component">
                        <label class="lui-radiobutton  lui-radiobutton--inverse"
                            title="{{'equalizer.label.mostrarconexiones'  | translate}}">
                            <input class="lui-radiobutton__input" type="radio" ng-model="$parent.typeValoresPerdidos"
                                ng-change="cambiarTipoValores('connect')" name="valoresPerdidos" value="connect"
                                aria-invalid="false">
                            <div class="lui-radiobutton__radio-wrap" qva-tabindex="0">
                                <span class="lui-radiobutton__radio"></span>
                                <span class="lui-radiobutton__radio-text">{{'equalizer.label.mostrarconexiones' |
                                    translate}}</span>
                            </div>
                        </label>
                    </div>
                    <div class="em-item em-item-inner em-radiobuttons-component">
                        <label class="lui-radiobutton  lui-radiobutton--inverse"
                            title="{{'equalizer.label.mostrarceros'  | translate}}">
                            <input class="lui-radiobutton__input" type="radio" ng-model="$parent.typeValoresPerdidos"
                                ng-change="cambiarTipoValores('zero')" name="valoresPerdidos" value="zero"
                                aria-invalid="false">
                            <div class="lui-radiobutton__radio-wrap" qva-tabindex="0">
                                <span class="lui-radiobutton__radio"></span>
                                <span class="lui-radiobutton__radio-text">{{'equalizer.label.mostrarceros' |
                                    translate}}</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="col-lg-12 border-bottom" ng-if="isVisibleTipoValores">
                    <div class="em-item em-item-inner em-checkbox-component">
                        <div class="value">
                            <label class="lui-checkbox lui-checkbox--inverse">
                                <input class="lui-checkbox__input" type="checkbox" ng-model="$parent.puntosDatos"
                                    ng-change="cambiarPuntosDatos(puntosDatos)" aria-invalid="false">
                                <div class="lui-checkbox__check-wrap">
                                    <span class="lui-checkbox__check"></span>
                                    <span class="lui-checkbox__check-text label">{{'equalizer.label.mostrarpuntos' |
                                        translate}}</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
