<div class="panel" id="template_treemap" ng-controller="treemapProperties">
    <div id="collapsePresentacion">
        <div class="em-section-content">
            <div class="em-grouped">
                <div class="em-switch-component" tcl="switch">
                    <div class="label" aria-disabled="false">
                        <div class="title">{{'equalizer.label.cabecerasyetiquetas'  | translate}}</div>
                        <div class="value" ng-bind-html="textCabeceras"></div>
                    </div>
                    <div lui-class-list="classList" class="lui-switch lui-switch--inverse">
                        <label class="lui-switch__label">
                            <input aria-label="{{'equalizer.label.cabecerasyetiquetas'  | translate}}" type="checkbox" class="lui-switch__checkbox" ng-model="cabeceras" ng-click="changeCabeceras($event)" ng-checked="cabeceras" id="cabeceras">
                            <span class="lui-switch__wrap">
                                <span class="lui-switch__inner"></span>
                                <span class="lui-switch__switch"></span>
                            </span>
                        </label>
                    </div>
                </div>
                
                <div ng-if="isVisibleCabeceras">
                    <div class="em-switch-component">
                        <div class="label">
                            <div class="title">{{'equalizer.label.cabecera'  | translate}}</div>
                            <div class="value" ng-bind-html="textHeaders"></div>
                        </div>
                        <div lui-class-list="classList" class="lui-switch lui-switch--inverse">
                            <label class="lui-switch__label">
                                <input aria-label="{{'equalizer.label.cabecera'  | translate}}" type="checkbox" class="lui-switch__checkbox" ng-model="headers" ng-click="changeHeaders($event)" ng-checked="headers" id="headers">
                                <span class="lui-switch__wrap">
                                    <span class="lui-switch__inner"></span>
                                    <span class="lui-switch__switch"></span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="em-switch-component">
                        <div class="label">
                            <div class="title">{{'equalizer.label.superponeretiquetas'  | translate}}</div>
                            <div class="value" ng-bind-html="textOverlay"></div>
                        </div>
                        <div lui-class-list="classList" class="lui-switch lui-switch--inverse">
                            <label class="lui-switch__label">
                                <input aria-label="{{'equalizer.label.superponeretiquetas'  | translate}}" type="checkbox" class="lui-switch__checkbox" ng-model="overlay" ng-click="changeOverlay($event)" ng-checked="overlay" id="overlay">
                                <span class="lui-switch__wrap">
                                    <span class="lui-switch__inner"></span>
                                    <span class="lui-switch__switch"></span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="em-switch-component">
                        <div class="label">
                            <div class="title">{{'equalizer.label.etiquetashojas'  | translate}}</div>
                            <div class="value" ng-bind-html="textLeaves"></div>
                        </div>
                        <div lui-class-list="classList" class="lui-switch lui-switch--inverse">
                            <label class="lui-switch__label">
                                <input aria-label="{{'equalizer.label.etiquetashojas'  | translate}}" type="checkbox" class="lui-switch__checkbox" ng-model="leaves" ng-click="changeLeaves($event)" ng-checked="leaves" id="leaves">
                                <span class="lui-switch__wrap">
                                    <span class="lui-switch__inner"></span>
                                    <span class="lui-switch__switch"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
                


                <div class="em-switch-component" tcl="switch" ng-if="isVisibleEtiquetas== true || cabeceras == true">
                    <div class="label">
                        <div class="title">{{'equalizer.label.etiquetasvalores'  | translate}}</div>
                        <div class="value" ng-bind-html="textEtiquetas"></div>
                    </div>
                    <div lui-class-list="classList" class="lui-switch lui-switch--inverse">
                        <label class="lui-switch__label">
                            <input aria-label="{{'equalizer.label.etiquetasvalores'  | translate}}" type="checkbox" class="lui-switch__checkbox" ng-model="etiquetas" ng-click="changeEtiquetas($event)" ng-checked="etiquetas" id="etiquetas">
                            <span class="lui-switch__wrap">
                                <span class="lui-switch__inner"></span>
                                <span class="lui-switch__switch"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
